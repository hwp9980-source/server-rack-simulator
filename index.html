<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서버랙 3D 시뮬레이터</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 상단 툴바 -->
    <header id="toolbar">
      <div class="brand">🗄️ 서버랙 3D 시뮬레이터</div>
      <div class="toolbar-group">
        <label for="rack-size">랙 크기</label>
        <div id="rack-size-stepper">
          <button id="rack-dec" class="btn step" title="1U 줄이기">−</button>
          <input type="number" id="rack-size" min="2" max="60" step="1" value="42" />
          <span class="unit-suffix">U</span>
          <button id="rack-inc" class="btn step" title="1U 늘리기">+</button>
        </div>
        <div class="preset-group">
          <button class="btn preset" data-u="12">12U</button>
          <button class="btn preset" data-u="24">24U</button>
          <button class="btn preset" data-u="42">42U</button>
          <button class="btn preset" data-u="48">48U</button>
        </div>
      </div>
      <div class="toolbar-group">
        <label for="rack-depth">랙 깊이</label>
        <div id="rack-depth-stepper">
          <button id="depth-dec" class="btn step" title="50mm 줄이기">−</button>
          <input type="number" id="rack-depth" min="500" max="1200" step="50" value="1000" />
          <span class="unit-suffix">mm</span>
          <button id="depth-inc" class="btn step" title="50mm 늘리기">+</button>
        </div>
        <div class="preset-group">
          <button class="btn preset-depth" data-d="600">600</button>
          <button class="btn preset-depth" data-d="800">800</button>
          <button class="btn preset-depth" data-d="1000">1000</button>
          <button class="btn preset-depth" data-d="1200">1200</button>
        </div>
      </div>
      <div class="toolbar-group">
        <button id="view-front" class="btn">정면</button>
        <button id="view-rear" class="btn">후면</button>
        <button id="view-iso" class="btn">사선</button>
      </div>
      <div class="toolbar-group">
        <label class="toggle-label">
          <input type="checkbox" id="frame-transparent" />
          프레임 투명화
        </label>
      </div>
      <div class="toolbar-group right">
        <button id="btn-export" class="btn">내보내기 (JSON)</button>
        <button id="btn-import" class="btn">불러오기</button>
        <input type="file" id="import-file" accept=".json" hidden />
        <button id="btn-clear" class="btn danger">전체 비우기</button>
      </div>
    </header>

    <div id="main">
      <!-- 좌측: 구성품 카탈로그 -->
      <aside id="catalog">
        <div class="catalog-header">
          <h2>구성품 카탈로그</h2>
          <input type="search" id="catalog-search" placeholder="모델명 · 제조사 검색…" />
          <div id="category-chips"></div>
        </div>
        <div id="catalog-list"></div>
      </aside>

      <!-- 중앙: 3D 뷰포트 -->
      <div id="viewport">
        <canvas id="canvas3d"></canvas>
        <div id="placement-hint" class="hidden">
          랙의 원하는 위치를 클릭해 장착 · <b>Shift</b>+클릭 연속 배치 · <b>ESC</b> 취소
        </div>
        <!-- 카메라 조작 패드 -->
        <div id="cam-controls" title="">
          <div class="cam-grid">
            <span></span>
            <button class="cam-btn" data-cam="up" title="위로 회전 (↑)">▲</button>
            <span></span>
            <button class="cam-btn" data-cam="left" title="왼쪽으로 회전 (←)">◀</button>
            <button class="cam-btn" data-cam="reset" title="시점 초기화 (Home)">⟲</button>
            <button class="cam-btn" data-cam="right" title="오른쪽으로 회전 (→)">▶</button>
            <span></span>
            <button class="cam-btn" data-cam="down" title="아래로 회전 (↓)">▼</button>
            <span></span>
          </div>
          <div class="cam-zoom">
            <button class="cam-btn" data-cam="zoomin" title="확대 (+)">＋</button>
            <button class="cam-btn" data-cam="zoomout" title="축소 (−)">－</button>
          </div>
        </div>

        <div id="stats-bar">
          <span id="stat-units">0 / 42U</span>
          <span id="stat-power">0 W</span>
          <span id="stat-weight">0.0 kg</span>
          <span id="stat-price">₩0</span>
        </div>

        <!-- 선택 유닛 정보 (오버레이) -->
        <aside id="inspector" class="hidden">
          <h2 id="insp-name"></h2>
          <div id="insp-vendor" class="muted"></div>
          <table id="insp-specs"></table>
          <div class="insp-actions">
            <button id="insp-up" class="btn">▲ 위로</button>
            <button id="insp-down" class="btn">▼ 아래로</button>
            <button id="insp-dup" class="btn">복제</button>
            <button id="insp-remove" class="btn danger">제거</button>
          </div>
          <p id="insp-hint" class="muted small">드래그 또는 <b>Shift</b>+↑/↓로 이동 · <b>Delete</b>로 제거<br />
            막힌 방향은 다음 빈 자리로 건너뜁니다</p>
        </aside>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
